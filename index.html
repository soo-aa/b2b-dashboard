const state={gran:'month',cur:'krw',page:0,sel:null,selBuyer:null};
let allBuyersForPeriod=[];

function fmtKRW(v){
  if(!v||v<0)return'–';
  if(v>=1e8)return'₩'+(v/1e8).toFixed(1)+'억';
  if(v>=1e4)return'₩'+(v/1e4).toFixed(0)+'만';
  return'₩'+Math.round(v).toLocaleString();
}
function fmtUSD(v){
  if(!v||v<0)return'–';
  if(v>=1e6)return'$'+(v/1e6).toFixed(2)+'M';
  if(v>=1e3)return'$'+(v/1e3).toFixed(1)+'k';
  return'$'+v.toLocaleString('en',{minimumFractionDigits:0,maximumFractionDigits:0});
}
function fmt(v){return state.cur==='krw'?fmtKRW(v):fmtUSD(v);}
function rateOf(y){return(+y)>=2025?1450:1350;}function krwOf(r){return r.krw>0?r.krw:r.usd*rateOf(r.year);}function usdOf(r){return r.usd>0?r.usd:r.krw/rateOf(r.year);}function val(r){return state.cur==='krw'?krwOf(r):usdOf(r);}

function weekStart(wk){
  const s=WEEK_MAP[wk];
  if(s)return new Date(s+'T00:00:00');
  const[y,w]=wk.split('-W');
  const d=new Date(+y,0,1+(+w-1)*7);
  d.setDate(d.getDate()-(d.getDay()||7)+1);
  return d;
}
function weekLabel(wk){
  const d=weekStart(wk);const e=new Date(d);e.setDate(d.getDate()+6);
  return`${d.getMonth()+1}/${d.getDate()}~${e.getMonth()+1}/${e.getDate()}`;
}
function monthLabel(m){const[y,mo]=m.split('-');return`'${y.slice(2)}/${mo}`;}

function getPages(){
  if(state.gran==='year')return[['2024','2025','2026']];
  if(state.gran==='month'){
    const ms=[...new Set(ECOUNT.map(r=>r.month))].sort();
    const pg=[];for(let i=0;i<ms.length;i+=12)pg.push(ms.slice(i,i+12));return pg;
  }
  const ws=[...new Set(ECOUNT.map(r=>r.week))].sort();
  const pg=[];for(let i=0;i<ws.length;i+=16)pg.push(ws.slice(i,i+16));return pg;
}
function curPage(){
  const pg=getPages();const i=Math.min(Math.max(0,state.page),pg.length-1);
  return{keys:pg[i],idx:i,total:pg.length};
}
function aggregate(keys){
  const m={};keys.forEach(k=>m[k]=0);
  ECOUNT.forEach(r=>{
    const k=state.gran==='year'?r.year:state.gran==='month'?r.month:r.week;
    if(k in m)m[k]+=val(r);
  });
  return keys.map(k=>m[k]);
}

function renderChart(){
  const{keys,idx,total}=curPage();
  const values=aggregate(keys);
  const maxV=Math.max(...values,1);
  let labels;
  if(state.gran==='year')labels=keys.map(k=>k+'년');
  else if(state.gran==='month')labels=keys.map(monthLabel);
  else labels=keys.map(weekLabel);

  document.getElementById('prevBtn').disabled=idx<=0;
  document.getElementById('nextBtn').disabled=idx>=total-1;
  const pl=document.getElementById('periodLabel');
  if(state.gran==='year')pl.textContent='2024~2026년';
  else if(state.gran==='month')pl.textContent=(keys[0]?.split('-')[0]||'')+'년';
  else{const s=weekStart(keys[0]),e=weekStart(keys[keys.length-1]);
    pl.textContent=`${s.getFullYear()}/${s.getMonth()+1}~${e.getFullYear()}/${e.getMonth()+1}`;}

  const W=800,H=240,PL=70,PR=10,PT=10,PB=50;
  const cw=W-PL-PR,ch=H-PT-PB,n=keys.length;
  const bw=Math.max(8,Math.floor(cw/n*0.7));
  const gap=(cw-bw*n)/(n+1);
  function niceTick(max){const mag=Math.pow(10,Math.floor(Math.log10(max)));const norm=max/mag;const tick=norm<=2?mag/5:norm<=5?mag/2:mag;return tick;}
  const tick=niceTick(maxV);const yticks=[];
  for(let v=0;v<=maxV*1.1;v+=tick){yticks.push(v);if(yticks.length>6)break;}

  let svg=`<svg class="svgchart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="cursor:pointer">`;
  yticks.forEach(v=>{
    const y=PT+ch-(v/maxV)*ch;
    svg+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#eef1f5" stroke-width="1"/>`;
    svg+=`<text x="${PL-4}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="9" fill="#9aa3af">${fmt(v)}</text>`;
  });
  keys.forEach((k,i)=>{
    const v=values[i];const bh=Math.max(2,(v/maxV)*ch);
    const x=PL+gap+(bw+gap)*i;const y=PT+ch-bh;
    const color=k===state.sel?'#e8913a':'#244061';
    svg+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" fill="${color}" rx="2" data-k="${k}"/>`;
    const lx=x+bw/2;
    svg+=`<text x="${lx.toFixed(1)}" y="${(H-PB+14).toFixed(1)}" text-anchor="middle" font-size="9" fill="#6b7686" transform="rotate(-35,${lx.toFixed(1)},${(H-PB+14).toFixed(1)})">${labels[i]}</text>`;
    if(bh>20)svg+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-3).toFixed(1)}" text-anchor="middle" font-size="8" fill="#4a5568">${fmt(v)}</text>`;
  });
  svg+='</svg>';

  const wrap=document.getElementById('chartWrap');
  wrap.innerHTML=svg;
  wrap.querySelectorAll('rect[data-k]').forEach(r=>{
    r.addEventListener('click',()=>{
      const k=r.dataset.k;state.sel=state.sel===k?null:k;
      renderChart();
      if(state.sel)showDetail(state.sel);
      else document.getElementById('detailPanel').style.display='none';
    });
  });
}

function normN(n){return(n||'').replace(/\([^)]*\)/g,'').toLowerCase().replace(/[^a-z0-9가-힣]/g,'').replace(/(.)(\1+)/g,'$1');}
function matchB(cb,ebs){
  const cn=normN(cb);if(!cn)return false;
  return ebs.some(eb=>{
    const en=normN(eb);if(!en)return false;
    if(cn===en)return true;
    const len=Math.min(5,cn.length,en.length);
    if(len>=4&&cn.slice(0,len)===en.slice(0,len))return true;
    if(cn.length>=6&&en.includes(cn.slice(0,6)))return true;
    if(en.length>=6&&cn.includes(en.slice(0,6)))return true;
    return false;
  });
}

function showComm(buyers){
  const filtered=[...COMM_LOGS]
    .filter(l=>matchB(l.buyer,buyers))
    .sort((a,b)=>b.date.localeCompare(a.date))
    .slice(0,60);
  if(!filtered.length){
    document.getElementById('commBody').innerHTML='<div class="msg">소통 기록 없음</div>';return;
  }
  document.getElementById('commBody').innerHTML=filtered.map(l=>`
    <div class="comm-item">
      <div class="comm-date">${l.date}</div>
      <div class="comm-buyer">${l.buyer}</div>
      <div class="comm-type">${l.type||'–'}</div>
      <div>
        <div class="comm-content">${l.content||'–'}</div>
        ${l.followup?`<div class="comm-followup">→ ${l.followup}</div>`:''}
      </div>
    </div>`).join('');
}

function showDetail(period){
  document.getElementById('detailPanel').style.display='block';
  let title;
  if(state.gran==='year')title=period+'년';
  else if(state.gran==='month'){const[y,m]=period.split('-');title=`${y}년 ${+m}월`;}
  else{const d=weekStart(period);const e=new Date(d);e.setDate(d.getDate()+6);
    title=`${d.getFullYear()}년 ${d.getMonth()+1}/${d.getDate()}~${e.getMonth()+1}/${e.getDate()}`;}
  document.getElementById('buyerTitle').textContent=title+' 업체별 매출';

  const key=state.gran==='year'?'year':state.gran==='month'?'month':'week';
  const rows=ECOUNT.filter(r=>r[key]===period);
  const bm={};
    rows.forEach(r=>{if(!bm[r.buyer])bm[r.buyer]={krw:0,usd:0,eq:0};bm[r.buyer].krw+=r.krw;bm[r.buyer].usd+=r.usd;bm[r.buyer].eq+=krwOf(r)});
    const list=Object.entries(bm).sort((a,b)=>b[1].eq-a[1].eq);
    const tot=list.reduce((s,[,v])=>s+v.eq,0);
  allBuyersForPeriod=list.map(([b])=>b);

  function renderRows(){
    document.getElementById('buyerBody').innerHTML=list.map(([b,v])=>{
      const am=state.cur==='krw'?v.krw:v.usd;
      const sel=state.selBuyer===b;
      return`<tr style="cursor:pointer;${sel?'background:#e8f0fb;font-weight:700':''}" data-buyer="${b}">
        <td>${b}${sel?' <span style="color:#244061;font-size:10px">▶</span>':''}</td>
        <td>${fmtKRW(v.krw)}</td><td>${fmtUSD(v.usd)}</td>
                <td>${tot?Math.round(v.eq/tot*100):0}%</td>
      </tr>`;
    }).join('');
    document.querySelectorAll('#buyerBody tr').forEach(tr=>{
      tr.addEventListener('click',()=>{
        const b=tr.dataset.buyer;
        state.selBuyer=state.selBuyer===b?null:b;
        renderRows();
        const active=state.selBuyer?[state.selBuyer]:allBuyersForPeriod;
        document.getElementById('commHint').textContent=state.selBuyer?`(${state.selBuyer})`:`(${allBuyersForPeriod.length}개 업체)`;
        showComm(active);
      });
    });
  }
  renderRows();
  state.selBuyer=null;
  document.getElementById('commHint').textContent=`(${allBuyersForPeriod.length}개 업체)`;
  showComm(allBuyersForPeriod);
}

document.querySelectorAll('#granSeg button').forEach(b=>b.addEventListener('click',()=>{
  state.gran=b.dataset.g;state.page=getPages().length-1;state.sel=null;
  document.getElementById('detailPanel').style.display='none';
  document.querySelectorAll('#granSeg button').forEach(x=>x.classList.toggle('on',x===b));
  renderChart();
}));
document.querySelectorAll('#curSeg button').forEach(b=>b.addEventListener('click',()=>{
  state.cur=b.dataset.c;
  document.querySelectorAll('#curSeg button').forEach(x=>x.classList.toggle('on',x===b));
  renderChart();if(state.sel)showDetail(state.sel);
}));
document.getElementById('prevBtn').addEventListener('click',()=>{
  state.page=Math.max(0,state.page-1);state.sel=null;
  document.getElementById('detailPanel').style.display='none';renderChart();
});
document.getElementById('nextBtn').addEventListener('click',()=>{
  state.page=Math.min(getPages().length-1,state.page+1);state.sel=null;
  document.getElementById('detailPanel').style.display='none';renderChart();
});

// 초기화
state.page=getPages().length-1;
renderChart();
const{keys}=curPage();
if(keys.length){state.sel=keys[keys.length-1];renderChart();showDetail(state.sel);}
</script>
